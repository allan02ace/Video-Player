<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#7c3aed"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"></head><body>
<title>AMPM Player</title>
<meta name="theme-color" content="#7c3aed">
<script>try{var pt=JSON.parse(localStorage.getItem('ampm:prefs')).theme;if(pt==='dark'||pt==='light')document.documentElement.dataset.theme=pt}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AMPM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Layout: sidebar | main (transcript + player stacked), sidebar expands on demand */
  :root {
    --bg:      #f2eefb;
    --panel:   #ffffff;
    --ink:     #1a1730;
    --muted:   #6b6a80;
    --chip:    #ebe5fa;
    --line:    #ddd6f5;
    --accent:  #6d28d9;
    --acc-fg:  #ffffff;
    --frame:   #1a1030;
    --shadow:  rgba(20,14,46,0.13);
    --lib-w:   68px;
    --lib-exp: 240px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:    #120e1f;
      --panel: #1c1730;
      --ink:   #ede8ff;
      --muted: #9490b0;
      --chip:  #2a2248;
      --line:  #2e2950;
      --frame: #0a0714;
      --shadow: rgba(0,0,0,0.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:    #120e1f;
    --panel: #1c1730;
    --ink:   #ede8ff;
    --muted: #9490b0;
    --chip:  #2a2248;
    --line:  #2e2950;
    --frame: #0a0714;
    --shadow: rgba(0,0,0,0.4);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 "Inter", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }

  button, input, textarea { font: inherit; }
  button { cursor: pointer; border: 0; background: none; color: inherit; padding: 0; }

  /* ── App shell ─────────────────────────────────────────── */
  .app {
    display: grid;
    grid-template-columns: var(--lib-w) minmax(0, 1fr);
    grid-template-rows: 1fr;
    height: 100dvh;
    padding: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    gap: 12px;
    max-width: 1800px;
    margin: 0 auto;
    transition: grid-template-columns 0.2s ease;
  }
  .app.lib-open {
    grid-template-columns: var(--lib-exp) minmax(0, 1fr);
  }

  /* ── Library sidebar ────────────────────────────────────── */
  .lib {
    display: flex;
    flex-direction: column;
    gap: 0;
    min-height: 0;
    background: var(--panel);
    border: 2px solid var(--frame);
    border-radius: 18px;
    box-shadow: 0 8px 24px var(--shadow);
    overflow: hidden;
    transition: opacity 0.15s;
  }

  .lib-head {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 12px 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
  }
  .logo {
    width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%;
    background: linear-gradient(135deg, #a78bfa, #6d28d9);
    position: relative;
  }
  .logo::before {
    content: "";
    position: absolute;
    left: 9px; top: 7px;
    width: 0; height: 0;
    border-left: 11px solid #fff;
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
  }
  .brand-name {
    font-size: 13px; font-weight: 700; letter-spacing: .04em;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .app.lib-open .brand-name { opacity: 1; }

  .lib-tools {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 100%;
  }

  .icon-btn {
    width: 34px; height: 34px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--chip); color: var(--ink);
    font-size: 14px; font-weight: 700;
    flex-shrink: 0;
    transition: background 0.1s;
  }
  .icon-btn:hover { background: var(--line); }
  .icon-btn.active {
    background: var(--accent); color: var(--acc-fg);
  }
  a.icon-btn { text-decoration: none; }
  .icon-btn.nav { background: var(--accent); color: var(--acc-fg); }
  .icon-btn.nav:hover { background: var(--accent); filter: brightness(1.12); }
  .icon-btn.icon-row {
    display: flex;              /* was inheriting display:grid, which stacked icon above label */
    align-items: center;
    width: 100%;
    flex-direction: row;
    justify-content: flex-start;
    gap: 8px;
    padding: 0 8px;
    overflow: hidden;
    line-height: 1;
    text-align: left;
  }
  .icon-btn.icon-row > span[aria-hidden="true"] {
    flex: 0 0 18px;
    width: 18px;
    text-align: center;
    font-size: 15px;
  }
  .app:not(.lib-open) .icon-btn.icon-row { justify-content: center; padding: 0; }
  .app:not(.lib-open) .icon-btn.icon-row .btn-label { display: none; }
  .icon-btn.icon-row .btn-label {
    font-size: 12px; font-weight: 600; white-space: nowrap;
    opacity: 0; transition: opacity 0.15s; overflow: hidden;
  }
  .app.lib-open .icon-btn.icon-row .btn-label { opacity: 1; }

  /* Library list */
  .lib-body {
    display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden;
  }
  .library-scroll {
    flex: 1; min-height: 0; overflow-y: auto; padding: 4px 6px;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .video-item {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 8px 6px; border-radius: 10px; text-align: left;
    transition: background 0.1s;
  }
  .video-item:hover { background: var(--chip); }
  .video-item.active { background: var(--accent); color: var(--acc-fg); }
  .thumb {
    width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px;
    background: var(--chip); display: grid; place-items: center; overflow: hidden;
  }
  .video-item.active .thumb { background: rgba(255,255,255,.2); }
  .thumb .bar {
    width: 10px; height: 10px; border-radius: 50%;
    border-left: 8px solid var(--accent);
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-radius: 0;
  }
  .video-item.active .thumb .bar { border-left-color: #fff; }
  .meta { min-width: 0; }
  .meta strong { display: block; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta span { font-size: 10px; color: var(--muted); }
  .video-item.active .meta span { color: rgba(255,255,255,.7); }

  .item-del {
    margin-left: auto; flex-shrink: 0; width: 22px; height: 22px; display: grid; place-items: center;
    border-radius: 6px; font-size: 11px; color: var(--muted); opacity: 0; cursor: pointer;
  }
  .video-item:hover .item-del, .video-item:focus-within .item-del { opacity: 1; }
  .item-del:hover { background: var(--line); }
  .video-item.active .item-del { color: rgba(255,255,255,.85); }
  .video-item.active .item-del:hover { background: rgba(255,255,255,.2); }
  @media (hover: none) { .item-del { opacity: .7; } }
  .keep-row { display: flex; align-items: center; gap: 6px; padding: 0 2px; font-size: 11px; color: var(--muted); cursor: pointer; }
  .keep-info { padding: 0 2px; font-size: 10px; color: var(--muted); line-height: 1.35; }
  .keep-info:empty { display: none; }
  .add-box {
    padding: 8px 6px 10px;
    border-top: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 5px;
  }
  .add-btn {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; width: 100%;
    background: var(--chip); border-radius: 9px;
    padding: 7px 8px; font-size: 11px; font-weight: 600;
    cursor: pointer; transition: background 0.1s;
    white-space: nowrap; overflow: hidden;
  }
  .add-btn:hover { background: var(--line); }
  .add-btn span { font-size: 14px; }

  /* collapsed state: only icon */
  .app:not(.lib-open) .library-scroll,
  .app:not(.lib-open) .add-box,
  .app:not(.lib-open) .brand-name {
    display: none;
  }

  /* ── Right column ───────────────────────────────────────── */
  .right-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    min-width: 0;
  }
  /* ── Transcript pane ────────────────────────────────────── */
  .transcript-pane {
    position: relative;
    flex: 1;
    display: flex; flex-direction: column;
    min-height: 0;
    background: var(--panel);
    border: 2px solid var(--frame);
    border-radius: 18px;
    box-shadow: 0 8px 24px var(--shadow);
    overflow: hidden;
    transition: flex 0.2s;
  }
  .transcript-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px 16px; border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .transcript-head strong { font-size: 14px; font-weight: 700; }
  .head-tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .mini-btn {
    background: var(--chip); color: var(--ink);
    padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;
    transition: background 0.1s;
  }
  .mini-btn:hover { background: var(--line); }
  .head-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .save-info { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .export-wrap { position: relative; }
  .export-menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 190px;
    display: flex; flex-direction: column; gap: 2px; padding: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
  }
  .menu-item { text-align: left; padding: 7px 10px; border-radius: 7px; font-size: 13px; color: var(--ink); background: transparent; }
  .menu-item:hover { background: var(--chip); }
  .menu-check { display: flex; align-items: center; gap: 7px; padding: 7px 10px 4px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 2px; }
  .mini-btn.primary { background: var(--accent); color: var(--acc-fg); }
  .mini-btn.primary:hover { background: #5b21b6; }

  .skip-box {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--muted);
    background: var(--chip); border-radius: 8px; padding: 5px 7px;
  }
  .skip-box input {
    width: 46px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink);
    padding: 3px 5px; font-size: 12px; text-align: center;
  }

  /* ── Speaker bar ── */
  .speaker-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 8px 16px; border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .spk-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--chip); border-radius: 20px;
    padding: 3px 6px 3px 4px; font-size: 12px; font-weight: 600;
    user-select: none; transition: background 0.1s;
  }
  .spk-chip:hover { background: var(--line); }
  .spk-chip .num {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); color: var(--acc-fg);
    display: grid; place-items: center; font-size: 11px; font-weight: 700;
  }
  .spk-chip .x { opacity: .45; padding: 0 3px; font-size: 14px; line-height: 1; }
  .spk-chip .x:hover { opacity: 1; }
  .spk-add {
    border: 1px dashed var(--muted); border-radius: 20px;
    background: var(--bg); color: var(--ink);
    padding: 4px 10px; font-size: 12px; width: 170px; outline: none;
  }
  .spk-add:focus { border-style: solid; border-color: var(--accent); }
  .spk-hint { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }

  /* Wrapper lets a highlight bar sit behind the (transparent) textarea */
  .editor-wrap {
    position: relative;
    flex: 1; min-height: 0;
    overflow: hidden;
  }
  .line-hl {
    position: absolute; top: 0; left: 0;
    pointer-events: none; z-index: 0;
    border-radius: 6px;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    box-shadow: inset 3px 0 0 var(--accent);
    will-change: transform;
  }
  /* Estimated position (by word count) rather than an exact stamp: lighter, dashed edge */
  .line-hl.est {
    background: color-mix(in srgb, var(--accent) 9%, transparent);
    box-shadow: none;
    border-left: 3px dashed color-mix(in srgb, var(--accent) 65%, transparent);
  }
  #transcriptText {
    position: relative; z-index: 1;
    height: 100%;
    width: 100%; border: 0; resize: none;
    background: transparent; color: var(--ink);
    padding: 14px 16px;
    font: 500 var(--tx-fs, 13.5px)/var(--tx-lh, 1.65) "Inter", sans-serif;
    outline: none;
  }
  #transcriptText::placeholder { color: var(--muted); }

  /* Status messages float over the editor's bottom-right corner and fade out; they take no layout space. */
  .transcript-footer { position: absolute; right: 14px; bottom: 10px; max-width: calc(100% - 28px); pointer-events: none; z-index: 5; }
  #tsStatus {
    font-size: 11px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px;
    opacity: 0; transition: opacity .2s;
  }
  #tsStatus.show { opacity: 1; }

  /* ── Player / stage ─────────────────────────────────────── */
  .stage {
    background: var(--panel);
    border: 2px solid var(--frame);
    border-radius: 18px;
    box-shadow: 0 8px 24px var(--shadow);
    padding: 12px 14px;
    flex-shrink: 0;
    display: flex; flex-direction: column; justify-content: center;
  }
  video { display: none; }

  .empty-player {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-align: center; color: var(--muted);
    font-size: 13px; padding: 20px;
  }
  .empty-player[hidden] { display: none; }
  .add-file-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: var(--acc-fg);
    border-radius: 9px; padding: 6px 12px;
    font-size: 12px; font-weight: 700; white-space: nowrap; flex-shrink: 0;
    transition: background 0.1s;
  }
  .add-file-btn:hover { background: #5b21b6; }
  .add-file-btn.big { font-size: 14px; padding: 12px 22px; border-radius: 12px; }
  .player-controls { display: flex; flex-direction: column; gap: 8px; width: 100%; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--chip); border-radius: 10px; padding: 6px 10px;
  }
  .video-title {
    font-size: 12px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .group { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .control-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--chip);
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700; color: var(--ink);
    transition: background 0.1s;
  }
  .control-btn:hover { background: var(--line); }
  .control-btn.play {
    width: 34px; height: 34px; flex-shrink: 0;
    background: var(--accent); color: var(--acc-fg); font-size: 14px;
  }
  .control-btn.play:hover { background: #5b21b6; }

  .controls-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--chip); border-radius: 10px; padding: 8px 10px;
  }

  .seek {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--muted); flex: 1; min-width: 0;
    font-variant-numeric: tabular-nums;
  }
  .seek input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }

  /* Timestamp bookmarks under the seek bar */
  .seek-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .seek-wrap input[type="range"] { flex: none; width: 100%; margin: 0; }
  .seek-marks { position: relative; height: 12px; }
  .seek-mark {
    position: absolute; top: 0; width: 10px; height: 12px; margin-left: -5px;
    padding: 0; border: 0; background: transparent; cursor: pointer;
  }
  .seek-mark::before {
    content: ""; position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: 3px; height: 9px; border-radius: 2px; background: var(--muted); opacity: .75;
  }
  .seek-mark:hover::before { background: var(--accent); opacity: 1; width: 4px; }
  .seek-mark.last::before { background: var(--accent); opacity: 1; width: 4px; height: 12px; }
  .last-stamp-btn {
    flex-shrink: 0; height: 28px; padding: 0 10px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--acc-fg); font: inherit; font-size: 11px; font-weight: 700;
    cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .last-stamp-btn:disabled { background: var(--chip); color: var(--muted); cursor: default; opacity: .6; }

  /* A-B loop between timestamps */
  .loop-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex-shrink: 0;
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .topbar .video-title { flex: 1; }
  .loop-row label { display: flex; align-items: center; gap: 6px; }
  .loop-btn {
    height: 26px; padding: 0 10px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--line); color: var(--ink); font: inherit; font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .loop-btn:hover { filter: brightness(.95); }
  .loop-btn[aria-pressed="true"] { background: var(--accent); color: var(--acc-fg); }
  .loop-row select {
    height: 26px; min-width: 64px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--ink); font: inherit; font-size: 11px; padding: 0 6px;
  }
  .loop-row select:disabled { opacity: .5; }
  .loop-row .loop-in {
    height: 26px; width: 74px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--ink); font: inherit; font-size: 11px; padding: 0 6px; text-align: center;
  }
  .loop-row .loop-in:disabled { opacity: .5; }
  .loop-row .loop-in.bad { border-color: #dc2626; }
  .loop-band {
    position: absolute; bottom: 0; height: 3px; border-radius: 2px;
    background: var(--accent); opacity: .85; pointer-events: none;
  }

  /* Zoomable timeline (waveform + ruler) */
  .tl-row {
    display: flex; flex-direction: column; gap: 6px;
    background: var(--chip); border-radius: 10px; padding: 8px 10px;
  }
  .tl-head {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .tl-time {
    font-size: 19px; font-weight: 700; line-height: 1.1; color: var(--ink); white-space: nowrap;
    font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
    background: var(--panel); border-radius: 8px; padding: 4px 10px;
  }
  .tl-time #totalTime { font-size: 15px; font-weight: 600; color: var(--muted); }
  /* Review mode: the clock is what you watch, so make it big with an accent frame */
  html.reviewing .tl-time { font-size: 30px; padding: 4px 14px; box-shadow: inset 0 0 0 2px var(--accent); }
  html.reviewing .tl-time #totalTime { font-size: 20px; }
  #currentTime { cursor: text; border-radius: 6px; }
  #currentTime:hover { box-shadow: 0 1px 0 0 var(--muted); }
  #currentTime:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .time-edit {
    font: inherit; font-variant-numeric: tabular-nums; color: var(--ink); background: var(--bg);
    border: 0; border-radius: 6px; padding: 0 4px; margin: -1px 0; width: 7.6ch; text-align: center;
    outline: 2px solid var(--accent);
  }
  .time-edit.bad { outline-color: #dc2626; }
  .tl-sep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }
  .tl-title { font-weight: 700; color: var(--ink); margin-right: 2px; }
  .tl-btn {
    height: 24px; min-width: 28px; padding: 0 8px; border-radius: 7px;
    background: var(--line); color: var(--ink); font-size: 12px; font-weight: 700; line-height: 1;
  }

<script>
  const video = document.getElementById('video');
  const libraryEl = document.getElementById('library');
    const emptyPlayerEl = document.getElementById('emptyPlayer');
  const controlsEl = document.getElementById('controls');
  const videoTitleEl = document.getElementById('videoTitle');
  const seekBar = document.getElementById('seekBar');
  const seekMarksEl = document.getElementById('seekMarks');
  const lastStampBtn = document.getElementById('lastStampBtn');
  const currentTimeEl = document.getElementById('currentTime');
  const totalTimeEl = document.getElementById('totalTime');
  const transcriptTextEl = document.getElementById('transcriptText');
  const tsStatusEl = document.getElementById('tsStatus');
  let tsStatusTimer = 0;
  new MutationObserver(() => {
    clearTimeout(tsStatusTimer);
    const has = !!tsStatusEl.textContent;
    tsStatusEl.classList.toggle('show', has);
    if (has) tsStatusTimer = setTimeout(() => { tsStatusEl.textContent = ''; }, 3000);
  }).observe(tsStatusEl, { childList: true, characterData: true, subtree: true });
  const appEl = document.getElementById('app');
  const skipInput = document.getElementById('skipInput');

  const state = {
    items: [],
    activeIndex: -1,
    libOpen: window.innerWidth > 700, // open on first sight (stays collapsed on phone-width screens, where it becomes a top bar)
    skipSeconds: 2,
    boost: 100,
    dark: false
  };

  // ── Helpers ───────────────────────────────────────────────
  function normalizeSkip() {
    const v = Number(skipInput.value);
    state.skipSeconds = Number.isFinite(v) ? Math.max(1, Math.min(60, Math.round(v))) : 2;
    skipInput.value = String(state.skipSeconds);
    return state.skipSeconds;
  }

  function fmtTime(s) {
    if (!Number.isFinite(s) || s < 0) return '0:00';
    const t = Math.floor(s);
    const h = Math.floor(t / 3600);
    const m = Math.floor((t % 3600) / 60);
    const sec = t % 60;
    return h > 0
      ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
      : `${m}:${String(sec).padStart(2,'0')}`;
  }

  function cleanName(n) { return n.replace(/\.[^/.]+$/, ''); }

  // ── Render ────────────────────────────────────────────────
  function applyClasses() {
    appEl.classList.toggle('lib-open', state.libOpen);

    document.getElementById('libToggle').classList.toggle('active', state.libOpen);
  }

  function renderLibrary() {
    libraryEl.innerHTML = '';
    if (!state.items.length) {
      const el = document.createElement('div');
      el.style.cssText = 'padding:16px 8px;color:var(--muted);font-size:12px;text-align:center';
      el.textContent = 'No media added yet';
      libraryEl.appendChild(el);
      return;
    }
    state.items.forEach((item, idx) => {
      const btn = document.createElement('button');
      btn.className = `video-item ${state.activeIndex === idx ? 'active' : ''}`;
      btn.type = 'button';
      btn.innerHTML = `
        <div class="thumb"><div class="bar"></div></div>
        <div class="meta">
          <strong></strong>
          <span>${item.type === 'video' ? '🎬 Video' : '🎵 Audio'}${item.saving ? ' · saving…' : item.saved ? ' · saved' : ''}</span>
        </div>
        <span class="item-del" role="button" tabindex="-1" title="Remove from the library" aria-label="Remove from the library">✕</span>`;
      btn.querySelector('strong').textContent = item.name;
      btn.querySelector('.item-del').onclick = ev => { ev.stopPropagation(); removeItem(idx); };
      btn.onclick = () => loadItem(idx, true);
      libraryEl.appendChild(btn);
    });
  }

  // ── Media ─────────────────────────────────────────────────
  function addFiles(fileList) {
    const added = [];
    Array.from(fileList || []).forEach(file => {
      if (!file) return;
      const isVideo = file.type.startsWith('video/') || /\.(mp4|m4v|mov|mkv|webm|avi|mpeg|mpg|wmv)$/i.test(file.name);
      const isAudio = file.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|aac|flac|wma|aiff)$/i.test(file.name);
      if (!isVideo && !isAudio) return;
      const key = `${file.name}|${file.size}|${file.lastModified}`;
      if (state.items.some(i => i.key === key)) return;
      const it = { key, name: cleanName(file.name), url: URL.createObjectURL(file), type: isVideo ? 'video' : 'audio', file };
      state.items.push(it); added.push(it);
    });
    renderLibrary();
    if (state.items.length && state.activeIndex === -1) loadItem(0, false);
    // auto-open library when files are added
    if (state.items.length) {
      state.libOpen = true;
      applyClasses();
    }
    added.forEach(persistItem);
  }

  function loadItem(index, autoplay) {
    if (index < 0 || index >= state.items.length) return;
    state.activeIndex = index;
    const item = state.items[index];
    txOnLoad(item);
    try { localStorage.setItem('ampm.activeFile', item.key); } catch (_) {}
    video.src = item.url;
    videoTitleEl.textContent = item.name;
    emptyPlayerEl.hidden = true;
    controlsEl.hidden = false;
    tsStatusEl.textContent = '';
    updatePlaybackUI();
    renderBookmarks();
    tlLoadPeaks(item);
    if (autoplay) video.play().catch(() => {});
    renderLibrary();
  }

  // ── Volume boost (Web Audio, up to 300%) ──────────────────
  // video.volume tops out at 100%, so the element is routed through a gain node
  // followed by a compressor that tames clipping at high boost.
  let audioCtx = null, gainNode = null;

  let voiceNodes = null, voiceOn = false;
  function applyVoice() {
    if (!voiceNodes) return;
    const { hp, pk, comp, makeup } = voiceNodes;
    if (voiceOn) {   // cut rumble, lift 2-3 kHz speech, level quiet vs loud, then limit
      hp.frequency.value = 110; pk.gain.value = 4;
      comp.threshold.value = -28; comp.knee.value = 20; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.2;
      makeup.gain.value = 1.5;
    } else {         // original behaviour: comp only protects against clipping at high boost
      hp.frequency.value = 10; pk.gain.value = 0;
      comp.threshold.value = -8; comp.knee.value = 8; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.25;
      makeup.gain.value = 1;
    }
  }
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      const src = audioCtx.createMediaElementSource(video);
      gainNode = audioCtx.createGain();
      const comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -8;
      comp.knee.value = 8;
      comp.ratio.value = 8;
      comp.attack.value = 0.003;
      comp.release.value = 0.25;
      // "Voice" chain (transparent while Voice is off): high-pass, presence lift, makeup gain, final limiter.
      const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 10; hp.Q.value = 0.7;
      const pk = audioCtx.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 2800; pk.Q.value = 0.8; pk.gain.value = 0;
      const makeup = audioCtx.createGain();
      const lim = audioCtx.createDynamicsCompressor();
      lim.threshold.value = -1; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.002; lim.release.value = 0.1;
      src.connect(hp).connect(pk).connect(gainNode).connect(comp).connect(makeup).connect(lim).connect(audioCtx.destination);
      voiceNodes = { hp, pk, comp, makeup };
    }
    applyVoice();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    gainNode.gain.value = state.boost / 100;
  }

  function setBoost(pct) {
    state.boost = Math.max(0, Math.min(300, Math.round(pct / 5) * 5));
    document.getElementById('boostBar').value = state.boost;
    document.getElementById('boostVal').textContent = state.boost + '%';
    if (state.boost !== 100 || audioCtx) ensureAudio();
  }

  function togglePlay() {
    if (state.activeIndex < 0) return;
    if (video.paused) video.play().catch(() => {});
    else video.pause();
  }

  function seekBy(s) {
    if (!video.duration) return;
    video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + s));
  }

  function updatePlaybackUI() {
    document.getElementById('playBtn').textContent = video.paused ? '▶' : '⏸';
    currentTimeEl.textContent = fmtTime(video.currentTime || 0);
    totalTimeEl.textContent = fmtTime(video.duration || 0);
    if (video.duration) seekBar.value = (video.currentTime / video.duration) * 1000;
  }

  let reviewOn = false;   // review mode: listening, editor locked until the first pause
  let reviewEdit = false; // review is on, but a pause has unlocked the editor
  let lastTypeAt = 0;     // when the user last typed (the caret does not jump away right after)
  let markOn = false;     // Mark mode (pass 1): stamp lines while listening
  let assignOn = false;   // Assign mode (pass 2): give each marked turn a speaker
  let modePos = -1;       // start of the line Mark / Assign is waiting on
  function reviewLocked() {
    if (markOn || assignOn) { tsStatusEl.textContent = (markOn ? 'Marking' : 'Assigning') + ' — press Esc to type'; return true; }
    if (!reviewOn || reviewEdit) return false;
    tsStatusEl.textContent = 'Review mode — pause to edit';
    return true;
  }

  // ── Timestamp formats ─────────────────────────────────────
  // Bracketed [m:ss] / [h:mm:ss] anywhere on a line (what Ctrl+Enter inserts), or a bare
  // m:ss / h:mm:ss at the START of a line, e.g. "00:00:02   Saan mo naman nalagayin?"
  // (pasted transcripts). Times of day such as "10:30 am" are not stamps.
  const BARE_STAMP = String.raw`(?:\d{1,2}:)?\d{1,2}:\d{2}(?:[.,]\d+)?(?=\s|$)(?!\s*[AaPp]\.?[Mm]\b)`;
  const STAMP_PREFIX = String.raw`(?:\[[\d:]+\]|` + BARE_STAMP + `)`;
  const BARE_LINE_RE = new RegExp('^(\\s*)(' + BARE_STAMP + ')');
  const BARE_WORD_RE = new RegExp('^[ \\t]*' + BARE_STAMP, 'gm');
  const BRACKET_STAMP_RE = /\[(?:(\d+):)?(\d{1,2}):(\d{2})\]/;
  function bareTime(t) {
    const m = t.match(/^(?:(\d{1,2}):)?(\d{1,2}):(\d{2})/);
    return (m[1] ? Number(m[1]) * 3600 : 0) + Number(m[2]) * 60 + Number(m[3]);
  }
  function lineStamp(line) {
    let m = line.match(BRACKET_STAMP_RE);
    if (m) return { time: (m[1] ? Number(m[1]) * 3600 : 0) + Number(m[2]) * 60 + Number(m[3]), index: m.index, len: m[0].length };
    m = line.match(BARE_LINE_RE);
    return m ? { time: bareTime(m[2]), index: m[1].length, len: m[2].length } : null;
  }
  function stripLineStamp(l) {
    if (BRACKET_STAMP_RE.test(l)) return l.replace(/\[(?:\d+:)?\d{1,2}:\d{2}\]\s?/g, '');
    const m = l.match(BARE_LINE_RE);
    return m ? l.slice(m[0].length).replace(/^[ \t]+/, '') : l;
  }

  function insertTimestamp() {
    if (reviewLocked()) return;
    if (!state.items[state.activeIndex]) { tsStatusEl.textContent = 'Load a file first'; return; }
    const stamp = `[${fmtTime(video.currentTime || 0)}] `;
    const s = transcriptTextEl.selectionStart;
    const e = transcriptTextEl.selectionEnd;
    transcriptTextEl.value = transcriptTextEl.value.slice(0, s) + stamp + transcriptTextEl.value.slice(e);
    transcriptTextEl.focus();
    transcriptTextEl.setSelectionRange(s + stamp.length, s + stamp.length);
    tsStatusEl.textContent = `Inserted ${stamp.trim()}`;
  }

  // ── Current-line highlight ────────────────────────────────
  // A textarea can't style one line, so a bar is drawn behind the transparent
  // textarea at the same pixel offset as the line the caret is on.
  const editorWrap = document.createElement('div');
  editorWrap.className = 'editor-wrap';
  const lineHl = document.createElement('div');
  lineHl.className = 'line-hl';
  lineHl.hidden = true;
  transcriptTextEl.parentNode.insertBefore(editorWrap, transcriptTextEl);
  editorWrap.append(lineHl, transcriptTextEl);

  // ── Text measuring (mirror) ───────────────────────────────
  // offsetOfChar() re-flows the same text in a hidden div to learn where a character sits. The mirror
  // must wrap EXACTLY like the textarea, otherwise the highlight drifts by whole rows on a long
  // transcript (4000+ words). So: the textarea's computed text styles are copied (not inherited from
  // <body>), its fractional content width is used (clientWidth is rounded), and the width is calibrated
  // against the textarea's real scrollHeight. Everything is re-measured when the Inter web font arrives
  // (display=swap re-flows the text), on resize, on font-size changes and after big text changes.
  // NOTE: these `let`s must stay above the first updateLineHighlight() call (temporal dead zone).
  const MIRROR_PROPS = ['fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'fontVariant', 'fontStretch', 'fontKerning',
    'fontFeatureSettings', 'fontVariationSettings', 'fontOpticalSizing', 'lineHeight', 'letterSpacing', 'wordSpacing',
    'textTransform', 'textIndent', 'textRendering', 'tabSize', 'wordBreak', 'hyphens', 'direction'];
  let mirrorEl = null, calDelta = 0, calLen = 0, calT = 0;
  let offCache = new Map(), offCacheText = null, offCacheSig = '';

  function getMirror() {
    if (!mirrorEl) {
      mirrorEl = document.createElement('div');
      mirrorEl.setAttribute('aria-hidden', 'true');
      mirrorEl.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;top:0;left:-9999px;' +
        'white-space:pre-wrap;overflow-wrap:break-word;word-wrap:break-word;box-sizing:border-box;overflow:hidden;border:0;';
      document.body.appendChild(mirrorEl);
    }
    return mirrorEl;
  }
  // Fractional width of the textarea's padding box minus its scrollbar (the mirror is border-box with the same padding).
  function textareaBoxWidth(ta, cs) {
    const bw = (parseFloat(cs.borderLeftWidth) || 0) + (parseFloat(cs.borderRightWidth) || 0);
    const sb = Math.max(0, ta.offsetWidth - ta.clientWidth - bw);
    return Math.max(10, ta.getBoundingClientRect().width - bw - sb);
  }
  function paintMirror(m, ta, cs, w) {
    for (const p of MIRROR_PROPS) if (cs[p]) m.style[p] = cs[p];
    m.style.padding = `${cs.paddingTop} ${cs.paddingRight} ${cs.paddingBottom} ${cs.paddingLeft}`;
    m.style.width = w + 'px';
  }
  // Find the mirror width whose total height equals the textarea's real scrollHeight (same number of rows).
  function calibrateMirror() {
    const ta = transcriptTextEl, val = ta.value;
    calLen = val.length;
    offCache.clear();
    if (!val || ta.scrollHeight <= ta.clientHeight + 1) { calDelta = 0; return; }
    const cs = getComputedStyle(ta), base = textareaBoxWidth(ta, cs), m = getMirror();
    paintMirror(m, ta, cs, base);
    m.textContent = val;
    const end = document.createElement('span'); end.textContent = '\u200b'; m.appendChild(end);
    const target = ta.scrollHeight;
    let best = 0, bestErr = Infinity;
    for (const d of [0, -0.25, 0.25, -0.5, 0.5, -1, 1, -2, 2, -3, 3]) {
      m.style.width = (base + d) + 'px';
      const err = Math.abs(m.scrollHeight - target);
      if (err < bestErr) { bestErr = err; best = d; }
      if (err <= 1) break;
    }
    calDelta = best;
    m.textContent = '';
  }
  function scheduleCalibrate() {
    clearTimeout(calT);
    calT = setTimeout(() => { calibrateMirror(); updateLineHighlight(); }, 200);
  }
  transcriptTextEl.addEventListener('input', scheduleCalibrate);
  window.addEventListener('resize', scheduleCalibrate);
  window.addEventListener('load', scheduleCalibrate);
  new ResizeObserver(scheduleCalibrate).observe(transcriptTextEl);
  if (document.fonts) {
    document.fonts.addEventListener('loadingdone', scheduleCalibrate);
    document.fonts.ready.then(scheduleCalibrate);
  }

  let hlDocTop = 0;

  function positionLineHighlight() {
    lineHl.style.transform = `translateY(${hlDocTop - transcriptTextEl.scrollTop}px)`;
  }

  // ── Where in the transcript is the audio? ────────────────
  // A stamp only says where a *block* starts: the stamp line plus the unstamped text under it, up to the
  // next stamp. Inside a block the position is estimated by word count: with a next stamp it is
  // elapsed / gap x words; after the last stamp it is elapsed x the speech pace (words per second)
  // learned from the stamped blocks above. If the user is typing inside that block, the cursor's row
  // is the better answer and wins. Returns null while paused or when no stamp has been reached.
  let paceKey = -1, paceVal = 2.3;
  function wordStarts(text, from, to) {
    const out = [], re = /\S+/g, body = text.slice(from, to);
    let m;
    while ((m = re.exec(body))) out.push(from + m.index);
    return out;
  }
  function speechPace(text, stamps) {
    if (paceKey === text.length) return paceVal;
    let words = 0, secs = 0, n = 0;
    for (let i = stamps.length - 2; i >= 0 && n < 40; i--) {
      const gap = stamps[i + 1].time - stamps[i].time;
      if (gap < 1 || gap > 60) continue;
      const w = wordStarts(text, afterStampPos(stamps[i]), stamps[i + 1].start).length;
      if (w < 2) continue;
      words += w; secs += gap; n++;
    }
    paceKey = text.length;
    paceVal = n >= 3 ? Math.min(4.5, Math.max(0.8, words / secs)) : 2.3;
    return paceVal;
  }
  function playPos() {
    if (video.paused || video.ended || !state.items[state.activeIndex]) return null;
    const ta = transcriptTextEl, text = ta.value;
    if (!text) return null;
    const stamps = parseStamps(text);
    const now = (video.currentTime || 0) + 0.25;
    let bi = -1;
    for (let i = 0; i < stamps.length; i++) {
      if (stamps[i].time <= now && (bi < 0 || stamps[i].time >= stamps[bi].time)) bi = i;
    }
    if (bi < 0) return null;
    const best = stamps[bi], next = stamps[bi + 1] || null;
    const blockEnd = next ? Math.max(best.end, next.start - 1) : text.length;
    const words = wordStarts(text, afterStampPos(best), blockEnd);
    const pos = ta.selectionStart || 0;
    const typing = document.activeElement === ta && pos >= best.start && pos <= blockEnd;
    let idx = 0, est = false;
    if (words.length) {
      const el = Math.max(0, now - best.time);
      const rate = next && next.time > best.time ? words.length / (next.time - best.time) : speechPace(text, stamps);
      idx = Math.min(words.length - 1, Math.floor(el * rate));
      est = el > 1.5 && words.length > 1;
    }
    return { best, blockEnd, typing, est, at: words.length ? words[idx] : best.start };
  }

  function updateLineHighlight() {
    const ta = transcriptTextEl;
    if (!ta.value && document.activeElement !== ta) { lineHl.hidden = true; return; }
    if (Math.abs(ta.value.length - calLen) > 200) scheduleCalibrate();
    const pp = playPos();
    const pos = ta.selectionStart || 0;
    let start, end, row = -1, est = false;
    if ((markOn || assignOn) && modePos >= 0) {          // Mark / Assign: the line waiting for a mark
      start = modePos; end = ta.value.indexOf('\n', modePos); if (end < 0) end = ta.value.length;
    }
    else if (pp) {                                       // playing: one row, not the whole line
      row = pp.typing ? pos : Math.min(pp.at + 1, ta.value.length); // typing in the block: your cursor row; else the estimated word's row
      est = !pp.typing && pp.est;
    }
    else {
      start = pos === 0 ? 0 : ta.value.lastIndexOf('\n', pos - 1) + 1;
      end = ta.value.indexOf('\n', pos);
      if (end < 0) end = ta.value.length;
    }
    const lh = parseFloat(getComputedStyle(ta).lineHeight) || 22;
    if (row >= 0) { hlDocTop = offsetOfChar(row); lineHl.style.height = lh + 'px'; }
    else { hlDocTop = offsetOfChar(start); lineHl.style.height = (offsetOfChar(end) - hlDocTop + lh) + 'px'; }
    lineHl.classList.toggle('est', est);
    lineHl.style.width = ta.clientWidth + 'px';
    lineHl.hidden = false;
    positionLineHighlight();
  }

  transcriptTextEl.addEventListener('input', updateLineHighlight);
  transcriptTextEl.addEventListener('keyup', updateLineHighlight);
  transcriptTextEl.addEventListener('click', updateLineHighlight);
  transcriptTextEl.addEventListener('focus', updateLineHighlight);
  transcriptTextEl.addEventListener('blur', updateLineHighlight);
  transcriptTextEl.addEventListener('scroll', positionLineHighlight);
  document.addEventListener('selectionchange', () => {
    if (document.activeElement === transcriptTextEl) updateLineHighlight();
  });
  window.addEventListener('resize', updateLineHighlight);
  window.addEventListener('load', updateLineHighlight);
  new ResizeObserver(updateLineHighlight).observe(transcriptTextEl);
  ['play', 'pause', 'seeked', 'ended'].forEach(ev => video.addEventListener(ev, updateLineHighlight));
  updateLineHighlight();

  // ── Speakers ──────────────────────────────────────────────
  // Nine numbered slots. Alt+1…9 (or clicking a chip) starts a new turn:
  //   [m:ss] NAME:
  // Ctrl+number can't be used: Chrome/Edge reserve it for switching tabs.
  const SPK_KEY = 'ampm.speakers';
  let speakers = Array(9).fill('');
  try {
    const saved = JSON.parse(localStorage.getItem(SPK_KEY) || 'null');
    if (Array.isArray(saved)) speakers = Array.from({ length: 9 }, (_, i) => (typeof saved[i] === 'string' ? saved[i] : ''));
  } catch (_) {}
  function saveSpeakers() { try { localStorage.setItem(SPK_KEY, JSON.stringify(speakers)); } catch (_) {} }

  const speakerBar = document.createElement('div');
  speakerBar.className = 'speaker-bar';
  const spkInput = document.createElement('input');
  spkInput.className = 'spk-add';
  spkInput.type = 'text';
  spkInput.placeholder = '+ Add speaker (Enter)';
  spkInput.setAttribute('aria-label', 'Add speaker');
  const spkHint = document.createElement('span');
  spkHint.className = 'spk-hint';
  spkHint.textContent = 'Alt + 1–9';
  speakerBar.append(spkInput, spkHint);
  editorWrap.parentNode.insertBefore(speakerBar, editorWrap);
  transcriptTextEl.placeholder += '\n  Alt + 1–9 — insert speaker (new line + timestamp)';

  function renderSpeakers() {
    speakerBar.querySelectorAll('.spk-chip').forEach(c => c.remove());
    speakers.forEach((name, slot) => {
      if (!name) return;
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'spk-chip';
      chip.title = 'Click to insert · double-click to rename';
      const num = document.createElement('span'); num.className = 'num'; num.textContent = String(slot + 1);
      const label = document.createElement('span'); label.textContent = name;
      const x = document.createElement('span'); x.className = 'x'; x.textContent = '×'; x.title = 'Remove';
      chip.append(num, label, x);
      chip.addEventListener('mousedown', e => e.preventDefault()); // keep caret in the editor
      chip.addEventListener('click', e => {
        if (e.target === x) { speakers[slot] = ''; saveSpeakers(); renderSpeakers(); return; }
        insertSpeaker(slot);
      });
      chip.addEventListener('dblclick', e => {
        if (e.target === x) return;
        const v = window.prompt(`Rename speaker ${slot + 1}`, name);
        if (v === null) return;
        const n = v.trim().replace(/:+$/, '').toUpperCase();
        if (n) { speakers[slot] = n; saveSpeakers(); renderSpeakers(); }
      });
      speakerBar.insertBefore(chip, spkInput);
    });
  }

  function addSpeaker(raw) {
    const name = raw.trim().replace(/:+$/, '').toUpperCase();
    if (!name) return;
    if (speakers.includes(name)) { tsStatusEl.textContent = `${name} already added`; return; }
    const slot = speakers.findIndex(s => !s);
    if (slot < 0) { tsStatusEl.textContent = 'All 9 speaker slots are used'; return; }
    speakers[slot] = name;
    saveSpeakers();
    renderSpeakers();
    tsStatusEl.textContent = `${name} = Alt+${slot + 1}`;
  }

  spkInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addSpeaker(spkInput.value); spkInput.value = ''; }
    else if (e.key === 'Escape') { spkInput.blur(); }
  });

  function insertSpeaker(slot) {
    if (reviewLocked()) return;
    const name = speakers[slot];
    if (!name) { tsStatusEl.textContent = `Speaker ${slot + 1} is empty — add one first`; return; }
    const ta = transcriptTextEl;
    const v = ta.value;
    const label = name + ': ';
    const pos = Math.min(ta.selectionStart || 0, v.length);
    const lineStart = pos === 0 ? 0 : v.lastIndexOf('\n', pos - 1) + 1;
    let lineEnd = v.indexOf('\n', pos);
    if (lineEnd < 0) lineEnd = v.length;
    const line = v.slice(lineStart, lineEnd);
    const sm = line.match(new RegExp('^\\s*' + STAMP_PREFIX + '\\s*'));
    const stampPart = sm ? sm[0] : '';
    const rest = line.slice(stampPart.length);
    const hasMedia = !!state.items[state.activeIndex];
    const newStamp = hasMedia ? `[${fmtTime(video.currentTime || 0)}] ` : '';

    let from, to, text;
    const existing = speakers.filter(Boolean).map(n => n + ':').find(l => rest.startsWith(l));
    if (existing) {
      // Line already has a speaker: swap it, keep timestamp and text.
      from = lineStart + stampPart.length;
      to = from + existing.length + (rest[existing.length] === ' ' ? 1 : 0);
      text = label;
    } else if (!rest.trim()) {
      // Empty (or timestamp-only) line: fill it in.
      from = lineStart; to = lineEnd;
      text = (stampPart ? stampPart.trim() + ' ' : newStamp) + label;
    } else if (pos === lineEnd) {
      // Caret at the end of a finished line: start a new turn below.
      from = to = lineEnd;
      text = '\n' + newStamp + label;
    } else {
      // Caret elsewhere in an unlabeled line: tag that line.
      from = to = lineStart + stampPart.length;
      text = label;
    }

    ta.focus();
    ta.setSelectionRange(from, to);
    // execCommand keeps Ctrl+Z working; fall back to setRangeText if unavailable.
    if (!document.execCommand || !document.execCommand('insertText', false, text)) {
      ta.setRangeText(text, from, to, 'end');
      ta.dispatchEvent(new Event('input', { bubbles: true }));
    }
    updateLineHighlight();
    tsStatusEl.textContent = `Speaker ${slot + 1}: ${name}`;
  }

  renderSpeakers();

  // ── Speaker name autocomplete ─────────────────────────────
  // Type the start of a name in CAPITALS followed by ":" at the start of a line
  // (after an optional [m:ss]) and it completes to the full label already used in
  // the transcript or saved in the speaker bar: "MA:" -> "DR. MARIANO:".
  // Needs 2+ letters. A label that already exists exactly (e.g. "MA:" is itself used) is left alone.
  // Ctrl+Z undoes the completion.
  const SPK_LABEL_RE = new RegExp('^\\s*(?:' + STAMP_PREFIX + '\\s*)?([A-ZÑ][A-ZÑ0-9 .\'\\-]{1,38}):(?=\\s|$)');
  let spkAutoBusy = false;

  function knownSpeakerNames(text, skipLine) {
    const map = new Map(); // name -> { count, last }
    const add = (name, line, weight) => {
      const n = name.trim();
      if (!n) return;
      const e = map.get(n) || { count: 0, last: -1 };
      e.count += weight; if (line > e.last) e.last = line;
      map.set(n, e);
    };
    speakers.filter(Boolean).forEach(n => add(n, -1, 1));
    text.split('\n').forEach((ln, i) => {
      if (i === skipLine) return;
      const m = ln.match(SPK_LABEL_RE);
      if (m) add(m[1], i, 1);
    });
    return map;
  }

  function matchSpeaker(typed, names) {
    const words = n => n.split(/[\s.\-]+/).filter(Boolean);
    const norm = n => n.replace(/\./g, '');   // "DR." and "DR" compare the same
    const T = norm(typed);
    let best = null;
    for (const [name, info] of names) {
      let score = 0;
      if (norm(name).startsWith(T)) score = 3;
      else if (words(name).some(w => w.startsWith(T))) score = 2;
      else if (words(name).map(w => w[0]).join('').startsWith(T)) score = 1;
      if (!score) continue;
      if (!best || score > best.score ||
          (score === best.score && (info.count > best.info.count ||
          (info.count === best.info.count && info.last > best.info.last)))) {
        best = { name, score, info };
      }
    }
    return best && best.name;
  }

  transcriptTextEl.addEventListener('input', e => {
    if (spkAutoBusy || e.isComposing || e.inputType !== 'insertText' || e.data !== ':') return;
    const ta = transcriptTextEl;
    const v = ta.value;
    const pos = ta.selectionStart;
    if (pos !== ta.selectionEnd || v[pos - 1] !== ':') return;
    const lineStart = pos === 0 ? 0 : v.lastIndexOf('\n', pos - 1) + 1;
    const m = v.slice(lineStart, pos).match(new RegExp('^(\\s*(?:' + STAMP_PREFIX + '\\s*)?)([A-ZÑ][A-ZÑ .\'\\-]*[A-ZÑ.]|[A-ZÑ]{2}):$'));
    if (!m) return;
    const typed = m[2].trim();
    if (typed.replace(/[^A-ZÑ]/g, '').length < 2) return;
    // Text after the caret on this line must not already be part of a label (e.g. editing "MA:" inside "MA: hi" is fine, so only check the typed part)
    const lineNo = v.slice(0, lineStart).split('\n').length - 1;
    const names = knownSpeakerNames(v, lineNo);
    if (names.has(typed)) return; // already a real label as typed
    const full = matchSpeaker(typed, names);
    if (!full || full === typed) return;
    const from = lineStart + m[1].length;
    spkAutoBusy = true;
    ta.setSelectionRange(from, pos);
    const text = full + ':';
    if (!document.execCommand || !document.execCommand('insertText', false, text)) {
      ta.setRangeText(text, from, pos, 'end');
      ta.dispatchEvent(new Event('input', { bubbles: true }));
    }
    spkAutoBusy = false;
    updateLineHighlight();
    tsStatusEl.textContent = `${typed}: → ${full}:`;
  });

  // ── Autosave (per media file, in this browser only) ───────
  // The transcript is saved in localStorage under the media file's library key
  // (name|size|lastModified), so adding the same file again brings its text back.
  // Nothing is uploaded. An empty editor never deletes a saved copy.
  const TX_PREFIX = 'ampm.tx.';
  const saveInfoEl = document.getElementById('saveInfo');
  let txKey = null;       // library key of the file the editor belongs to (null = unsaved draft)
  let txName = '';
  let txTimer = 0;
  let pausedAt = null;    // playback position when paused (used by auto-rewind)

  function txClock() { return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  function txRead(key) {
    try {
      const r = JSON.parse(localStorage.getItem(TX_PREFIX + key) || 'null');
      return r && typeof r.text === 'string' ? r : null;
    } catch (_) { return null; }
  }
  function txSaveNow() {
    clearTimeout(txTimer); txTimer = 0;
    const text = transcriptTextEl.value;
    if (!text) return;
    try {
      localStorage.setItem(TX_PREFIX + (txKey || 'draft'), JSON.stringify({ text, t: Date.now(), name: txName }));
      saveInfoEl.textContent = 'Saved ' + txClock();
    } catch (_) {
      saveInfoEl.textContent = 'Not saved (browser storage full)';
    }
  }
  function txSetText(text) {
    const ta = transcriptTextEl;
    ta.value = text;
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    ta.setSelectionRange(text.length, text.length);
    ta.scrollTop = ta.scrollHeight;
  }
  // Called by loadItem before the new media is set.
  function txOnLoad(item) {
    pausedAt = null;
    if (item.key === txKey) { txName = item.name; return; }
    txSaveNow();                                   // flush the file we are leaving
    const prevKey = txKey, prevName = txName;
    const hadText = !!transcriptTextEl.value;
    const saved = txRead(item.key);
    let note = '';
    if (prevKey) {
      // Switching files: the editor shows that file's own transcript.
      txSetText(saved ? saved.text : '');
      if (saved) note = 'Restored saved transcript';
      else if (hadText && !state.items.some(i => i.key === prevKey)) note = 'Transcript for “' + (prevName || 'the previous file') + '” is kept. Add that file again to bring it back.';
    } else if (!hadText) {
      if (saved) { txSetText(saved.text); note = 'Restored saved transcript'; }
    } else if (saved && saved.text !== transcriptTextEl.value) {
      const when = new Date(saved.t).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
      if (confirm('A saved transcript for this file exists (saved ' + when + ').\n\nOK = load the saved one\nCancel = keep what is in the editor now (it will replace the saved one)')) {
        txSetText(saved.text); note = 'Restored saved transcript';
      }
    }
    txKey = item.key; txName = item.name;
    txSaveNow();
    if (!prevKey) { try { localStorage.removeItem(TX_PREFIX + 'draft'); } catch (_) {} }
    if (note) tsStatusEl.textContent = note;
  }
  transcriptTextEl.addEventListener('input', () => {
    clearTimeout(txTimer);
    txTimer = setTimeout(txSaveNow, 700);
  });
  window.addEventListener('pagehide', txSaveNow);
  document.addEventListener('visibilitychange', () => { if (document.hidden) txSaveNow(); });
  // On start: if the editor is empty, bring back the most recently saved transcript.
  (function txRestoreLast() {
    if (transcriptTextEl.value) return;
    let best = null;
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k || !k.startsWith(TX_PREFIX)) continue;
        const r = txRead(k.slice(TX_PREFIX.length));
        if (r && (!best || r.t > best.r.t)) best = { k: k.slice(TX_PREFIX.length), r };
      }
    } catch (_) {}
    if (!best) return;
    txKey = best.k === 'draft' ? null : best.k;
    txName = best.r.name || '';
    txSetText(best.r.text);
    saveInfoEl.textContent = 'Restored ' + new Date(best.r.t).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
    tsStatusEl.textContent = txName ? 'Restored last transcript: ' + txName : 'Restored last transcript';
  })();

  // ── Export (.txt / Word .doc) ─────────────────────────────
  const exportBtn = document.getElementById('exportBtn');
  const exportMenu = document.getElementById('exportMenu');
  const exportStampsEl = document.getElementById('exportStamps');
  try { exportStampsEl.checked = localStorage.getItem('ampm.exportStamps') !== '0'; } catch (_) {}
  function closeExport() { exportMenu.hidden = true; exportBtn.setAttribute('aria-expanded', 'false'); }
  exportBtn.addEventListener('click', e => {
    e.stopPropagation();
    exportMenu.hidden = !exportMenu.hidden;
    exportBtn.setAttribute('aria-expanded', String(!exportMenu.hidden));
  });
  document.addEventListener('click', e => { if (!exportMenu.hidden && !e.target.closest('.export-wrap')) closeExport(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !exportMenu.hidden) closeExport(); });
  exportStampsEl.addEventListener('change', () => {
    try { localStorage.setItem('ampm.exportStamps', exportStampsEl.checked ? '1' : '0'); } catch (_) {}
  });
  exportMenu.querySelectorAll('[data-fmt]').forEach(b => b.addEventListener('click', () => {
    exportTranscript(b.dataset.fmt); closeExport();
  }));

  function exportTranscript(fmt) {
    const raw = transcriptTextEl.value;
    if (!raw.trim()) { tsStatusEl.textContent = 'Nothing to export yet'; return; }
    const STAMP = /\[(?:\d+:)?\d{1,2}:\d{2}\]\s?/g;
    let lines = raw.replace(/\r\n?/g, '\n').split('\n');
    if (!exportStampsEl.checked) {
      lines = lines.map(l => { const o = stripLineStamp(l); return (o.trim() === '' && l.trim() !== '') ? null : o; })
                   .filter(l => l !== null);
    }
    const item = state.items[state.activeIndex];
    const base = (item ? item.name : (txName || 'transcript')).replace(/[\\/:*?"<>|]+/g, '_');
    let blob, name;
    if (fmt === 'doc') {
      const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const labelRe = new RegExp('^(\\s*(?:' + STAMP_PREFIX + '\\s*)?)([A-ZÑ][A-ZÑ0-9 .\'\\-]{1,38}:)(?=\\s|$)');
      const paras = lines.map(l => {
        if (!l.trim()) return '<p>&nbsp;</p>';
        const m = l.match(labelRe);
        const stampWrap = h => BRACKET_STAMP_RE.test(h)
          ? h.replace(/(\[[\d:]+\])/, '<span class="t">$1</span>')
          : h.replace(BARE_LINE_RE, '$1<span class="t">$2</span>');
        return m
          ? '<p>' + stampWrap(esc(m[1])) + '<b>' + esc(m[2]) + '</b>' + esc(l.slice(m[0].length)) + '</p>'
          : '<p>' + stampWrap(esc(l)) + '</p>';
      }).join('\n');
      const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>' + esc(base) + '</title><style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt}p{margin:0 0 8pt}.t{color:#666666}</style></head><body>\n' + paras + '\n</body></html>';
      blob = new Blob(['\ufeff', html], { type: 'application/msword' });
      name = base + '.doc';
    } else {
      blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/plain;charset=utf-8' });
      name = base + '.txt';
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.hidden = true;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    tsStatusEl.textContent = 'Exported ' + name;
  }
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 's') {
      e.preventDefault(); exportTranscript('txt');
    }
  });

  // ── Auto-rewind on resume ─────────────────────────────────
  // After a pause, pressing play first jumps back N seconds so the last words are heard again.
  // Skipped when the position was moved while paused (seek, click on a timestamp, loop wrap).
  const rewindInput = document.getElementById('rewindInput');
  function getRewind() {
    const n = Number(rewindInput.value);
    return Number.isFinite(n) ? Math.max(0, Math.min(10, Math.round(n))) : 0;
  }
  try { const r = localStorage.getItem('ampm.rewind'); if (r !== null) rewindInput.value = r; } catch (_) {}
  rewindInput.value = String(getRewind());
  rewindInput.addEventListener('change', () => {
    rewindInput.value = String(getRewind());
    try { localStorage.setItem('ampm.rewind', rewindInput.value); } catch (_) {}
  });
  video.addEventListener('pause', () => { pausedAt = video.ended ? null : video.currentTime; });
  video.addEventListener('play', () => {
    const sec = getRewind();
    const p = pausedAt; pausedAt = null;
    if (p == null || !sec) return;
    if (Math.abs(video.currentTime - p) > 1.5) return;
    video.currentTime = Math.max(0, p - sec);
  });

  // ── Playback speed (pitch stays natural) ──────────────────
  const speedSel = document.getElementById('speedSel');
  const SPEEDS = Array.from(speedSel.options).map(o => Number(o.value));
  function setSpeed(r, announce) {
    let best = SPEEDS[0];
    SPEEDS.forEach(x => { if (Math.abs(x - r) < Math.abs(best - r)) best = x; });
    video.defaultPlaybackRate = best;
    video.playbackRate = best;
    try { video.preservesPitch = true; video.webkitPreservesPitch = true; } catch (_) {}
    speedSel.value = String(best);
    try { localStorage.setItem('ampm.speed', String(best)); } catch (_) {}
    if (announce) tsStatusEl.textContent = 'Speed ' + best + '×';
  }
  function stepSpeed(dir) {
    const i = SPEEDS.indexOf(Number(speedSel.value));
    const j = Math.max(0, Math.min(SPEEDS.length - 1, (i < 0 ? SPEEDS.indexOf(1) : i) + dir));
    setSpeed(SPEEDS[j], true);
  }
  speedSel.addEventListener('change', () => setSpeed(Number(speedSel.value), false));
  video.addEventListener('loadedmetadata', () => setSpeed(Number(speedSel.value), false)); // new src resets the rate
  try { const sp = localStorage.getItem('ampm.speed'); if (sp) setSpeed(Number(sp), false); } catch (_) {}
  document.addEventListener('keydown', e => {
    if (e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
      e.preventDefault(); e.stopImmediatePropagation();
      stepSpeed(e.key === 'ArrowUp' ? 1 : -1);
    }
  });

  // ── Voice clean-up (Web Audio filter chain) ───────────────
  const voiceBtn = document.getElementById('voiceBtn');
  function setVoice(on, announce) {
    voiceOn = !!on;
    voiceBtn.setAttribute('aria-pressed', String(voiceOn));
    try { localStorage.setItem('ampm.voice', voiceOn ? '1' : '0'); } catch (_) {}
    if (voiceOn || voiceNodes) { ensureAudio(); applyVoice(); }
    if (announce) tsStatusEl.textContent = voiceOn ? 'Clear voice on' : 'Clear voice off';
  }
  voiceBtn.addEventListener('click', () => setVoice(!voiceOn, true));
  try { if (localStorage.getItem('ampm.voice') === '1') { voiceOn = true; voiceBtn.setAttribute('aria-pressed', 'true'); } } catch (_) {}
  video.addEventListener('play', () => { if (voiceOn) ensureAudio(); }); // the audio graph needs a play gesture first

  // ── Quick markers: F2 [inaudible], F4 [crosstalk] ─────────
  // "[inaudible 1:56:48]" is not a timestamp (no bracket right around the time), so the timeline ignores it.
  function insertAtCaret(text) {
    const ta = transcriptTextEl;
    ta.focus();
    if (!document.execCommand || !document.execCommand('insertText', false, text)) {
      ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end');
      ta.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }
  function insertMarker(word) {
    if (reviewLocked()) return;
    const ta = transcriptTextEl;
    const v = ta.value, a = ta.selectionStart, b = ta.selectionEnd;
    const hasMedia = !!state.items[state.activeIndex];
    const body = '[' + word + (hasMedia ? ' ' + fmtTime(video.currentTime || 0) : '') + ']';
    const pre = a > 0 && !/\s/.test(v[a - 1]) ? ' ' : '';
    const post = b < v.length && /\s/.test(v[b]) ? '' : ' ';
    insertAtCaret(pre + body + post);
    updateLineHighlight();
    tsStatusEl.textContent = 'Marked ' + body;
  }
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
    if (e.key === 'F2') { e.preventDefault(); insertMarker('inaudible'); }
    else if (e.key === 'F4') { e.preventDefault(); insertMarker('crosstalk'); }
  });

  // ── Find & replace (Ctrl+F / Ctrl+H) ──────────────────────
  const findBar = document.createElement('div');
  findBar.className = 'find-bar';
  findBar.hidden = true;
  findBar.innerHTML =
    '<div class="find-row">' +
      '<input id="findInput" placeholder="Find" aria-label="Find in transcript" spellcheck="false" autocomplete="off">' +
      '<span class="find-count" id="findCount"></span>' +
      '<button type="button" id="findPrev" title="Previous (Shift+Enter)" aria-label="Previous match">↑</button>' +
      '<button type="button" id="findNext" title="Next (Enter)" aria-label="Next match">↓</button>' +
      '<button type="button" id="findCase" aria-pressed="false" title="Match case">Aa</button>' +
      '<button type="button" id="findToggle" title="Show replace (Ctrl+H)" aria-label="Show replace">⇄</button>' +
      '<button type="button" id="findClose" title="Close (Esc)" aria-label="Close find">✕</button>' +
    '</div>' +
    '<div class="find-row" id="replaceRow" hidden>' +
      '<input id="replaceInput" placeholder="Replace with" aria-label="Replace with" spellcheck="false" autocomplete="off">' +
      '<button type="button" id="repOne">Replace</button>' +
      '<button type="button" id="repAll">All</button>' +
    '</div>' +
    '<div class="find-row find-chips">Jump to: ' +
      '<button type="button" data-q="[inaudible">inaudible</button>' +
      '<button type="button" data-q="[crosstalk">crosstalk</button>' +
    '</div>';
  editorWrap.appendChild(findBar);
  const findInput = document.getElementById('findInput');
  const replaceInput = document.getElementById('replaceInput');
  const replaceRow = document.getElementById('replaceRow');
  const findCountEl = document.getElementById('findCount');
  const findCaseBtn = document.getElementById('findCase');
  let findTimer = 0;

  function findRegex() {
    const q = findInput.value;
    if (!q) return null;
    return new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), findCaseBtn.getAttribute('aria-pressed') === 'true' ? 'g' : 'gi');
  }
  function findAll() {
    const re = findRegex();
    if (!re) return [];
    const out = [];
    const v = transcriptTextEl.value;
    let m;
    while ((m = re.exec(v)) !== null) { out.push({ start: m.index, end: m.index + m[0].length }); if (m[0].length === 0) re.lastIndex++; }
    return out;
  }
  function findUpdateCount() {
    const all = findAll();
    if (!findInput.value) { findCountEl.textContent = ''; return all; }
    if (!all.length) { findCountEl.textContent = 'No results'; return all; }
    const ta = transcriptTextEl;
    const i = all.findIndex(m => m.start === ta.selectionStart && m.end === ta.selectionEnd);
    findCountEl.textContent = (i >= 0 ? (i + 1) + ' / ' : '') + all.length;
    return all;
  }
  // If the match sits inside a marker like "[inaudible 1:56:48]", move the audio there too.
  function seekToMarkerAt(idx) {
    if (!state.items[state.activeIndex]) return;
    const v = transcriptTextEl.value;
    const ls = idx === 0 ? 0 : v.lastIndexOf('\n', idx - 1) + 1;
    let le = v.indexOf('\n', idx); if (le < 0) le = v.length;
    const line = v.slice(ls, le);
    const re = /\[([^\]\d]*?)\s+((?:\d+:)?\d{1,2}:\d{2})\]/g;
    let m;
    while ((m = re.exec(line)) !== null) {
      const a = ls + m.index, b = a + m[0].length;
      if (idx >= a && idx < b) {
        const parts = m[2].split(':').map(Number);
        const t = parts.length === 3 ? parts[0] * 3600 + parts[1] * 60 + parts[2] : parts[0] * 60 + parts[1];
        if (Number.isFinite(t)) video.currentTime = Math.min(t, video.duration || t);
        return;
      }
    }
  }
  function findGoto(m) {
    const ta = transcriptTextEl;
    suppressSyncUntil = performance.now() + 4000;
    ta.focus({ preventScroll: true });
    ta.setSelectionRange(m.start, m.end);
    ta.scrollTop = Math.max(0, offsetOfChar(m.start) - ta.clientHeight / 3);
    updateLineHighlight();
    findInput.focus();
    seekToMarkerAt(m.start);
    findUpdateCount();
  }
  function findStep(dir, fromStart) {
    const all = findAll();
    if (!all.length) { findUpdateCount(); return; }
    const ta = transcriptTextEl;
    let m;
    if (dir > 0) {
      const from = fromStart ? ta.selectionStart : ta.selectionEnd;
      m = all.find(x => x.start >= from) || all[0];
    } else {
      const from = ta.selectionStart;
      for (let i = all.length - 1; i >= 0; i--) if (all[i].start < from) { m = all[i]; break; }
      m = m || all[all.length - 1];
    }
    findGoto(m);
  }
  function openFind(withReplace) {
    const ta = transcriptTextEl;
    const sel = ta.value.slice(ta.selectionStart, ta.selectionEnd);
    if (sel && sel.length < 80 && !sel.includes('\n')) findInput.value = sel;
    findBar.hidden = false;
    if (withReplace) replaceRow.hidden = false;
    findInput.focus(); findInput.select();
    findUpdateCount();
  }
  function closeFind() {
    findBar.hidden = true;
    transcriptTextEl.focus({ preventScroll: true });
  }
  function replaceOne() {
    if (reviewLocked()) return;
    const ta = transcriptTextEl;
    const re = findRegex();
    if (!re) return;
    const sel = ta.value.slice(ta.selectionStart, ta.selectionEnd);
    const isMatch = sel && new RegExp('^(?:' + re.source + ')$', re.flags.replace('g', '')).test(sel);
    if (isMatch) {
      ta.focus({ preventScroll: true });
      const keep = ta.scrollTop;
      insertAtCaret(replaceInput.value);
      ta.scrollTop = keep;
    }
    findStep(1, true);
  }
  function replaceAll() {
    if (reviewLocked()) return;
    const re = findRegex();
    const ta = transcriptTextEl;
    if (!re) return;
    const count = findAll().length;
    if (!count) { findUpdateCount(); return; }
    const rep = replaceInput.value;
    const next = ta.value.replace(re, () => rep);
    const keepTop = ta.scrollTop, keepPos = ta.selectionStart;
    ta.focus({ preventScroll: true });
    ta.select();
    if (!document.execCommand || !document.execCommand('insertText', false, next)) {
      ta.value = next;
      ta.dispatchEvent(new Event('input', { bubbles: true }));
    }
    ta.setSelectionRange(Math.min(keepPos, next.length), Math.min(keepPos, next.length));
    ta.scrollTop = keepTop;
    findInput.focus();
    tsStatusEl.textContent = 'Replaced ' + count + (count === 1 ? ' match' : ' matches') + ' (Ctrl+Z undoes all)';
    findUpdateCount();
  }

  findInput.addEventListener('input', () => { findStep(1, true); });
  findInput.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.stopPropagation(); return; }
    if (e.key === 'Enter') { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); }
    else if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
    if (!(e.ctrlKey || e.metaKey)) e.stopPropagation();   // typing here must not trigger playback shortcuts ([ and ] would skip)
  });
  replaceInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); replaceOne(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
    if (!(e.ctrlKey || e.metaKey)) e.stopPropagation();
  });
  document.getElementById('findNext').addEventListener('click', () => findStep(1));
  document.getElementById('findPrev').addEventListener('click', () => findStep(-1));
  document.getElementById('findClose').addEventListener('click', closeFind);
  document.getElementById('findToggle').addEventListener('click', () => { replaceRow.hidden = !replaceRow.hidden; });
  findCaseBtn.addEventListener('click', () => {
    findCaseBtn.setAttribute('aria-pressed', String(findCaseBtn.getAttribute('aria-pressed') !== 'true'));
    findStep(1, true);
  });
  document.getElementById('repOne').addEventListener('click', replaceOne);
  document.getElementById('repAll').addEventListener('click', replaceAll);
  findBar.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => {
    findInput.value = b.dataset.q; findStep(1);
  }));
  transcriptTextEl.addEventListener('input', () => {
    if (findBar.hidden) return;
    clearTimeout(findTimer); findTimer = setTimeout(findUpdateCount, 200);
  });
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;
    const k = e.key.toLowerCase();
    if (k === 'f') { e.preventDefault(); openFind(false); }
    else if (k === 'h') { e.preventDefault(); openFind(true); }
  });

  // ── Word count and typing progress (bottom-left of the editor) ──
  const editorMeta = document.createElement('div');
  editorMeta.className = 'editor-meta';
  editorMeta.hidden = true;
  editorWrap.parentNode.appendChild(editorMeta);
  let metaTimer = 0;
  function updateMeta() {
    const v = transcriptTextEl.value;
    if (!v.trim()) { editorMeta.hidden = true; return; }
    const words = v.replace(BARE_WORD_RE, ' ').split(/\s+/).filter(w => w && !/^\[[^\]]*\]$/.test(w)).length;
    let txt = words.toLocaleString() + (words === 1 ? ' word' : ' words');
    const dur = video.duration;
    if (state.items[state.activeIndex] && Number.isFinite(dur) && dur > 0) {
      const st = parseStamps(v);
      if (st.length) {
        const t = Math.max(...st.map(x => x.time));
        txt += ' · typed to ' + fmtTime(t) + ' of ' + fmtTime(dur) + ' (' + Math.min(100, Math.round(t / dur * 100)) + '%)';
      }
    }
    editorMeta.textContent = txt;
    editorMeta.hidden = false;
  }
  function scheduleMeta() { clearTimeout(metaTimer); metaTimer = setTimeout(updateMeta, 250); }
  transcriptTextEl.addEventListener('input', scheduleMeta);
  ['loadedmetadata', 'durationchange', 'emptied'].forEach(n => video.addEventListener(n, scheduleMeta));
  updateMeta();

  // ── Phrase shortcuts: type a short form + space/punctuation and it expands ──
  // List is "short = full text", one per line, saved in localStorage ('ampm.phrases').
  const PHRASE_KEY = 'ampm.phrases';
  let phraseMap = new Map();
  let phraseBusy = false;
  function parsePhrases(raw) {
    const map = new Map(), bad = [];
    String(raw || '').split('\n').forEach((line, i) => {
      const t = line.trim();
      if (!t || t.startsWith('#')) return;
      const eq = t.indexOf('=');
      const key = eq > 0 ? t.slice(0, eq).trim().toLowerCase() : '';
      const val = eq > 0 ? t.slice(eq + 1).trim() : '';
      if (!/^[a-z0-9]{1,12}$/.test(key) || !val) { bad.push(i + 1); return; }
      if (map.size < 300) map.set(key, val);
    });
    return { map, bad };
  }
  function loadPhrases() {
    let raw = '';
    try { raw = localStorage.getItem(PHRASE_KEY) || ''; } catch (_) {}
    phraseMap = parsePhrases(raw).map;
    return raw;
  }
  loadPhrases();

  transcriptTextEl.addEventListener('input', e => {
    if (phraseBusy || !phraseMap.size || e.isComposing || e.inputType !== 'insertText' || !/^[ .,;?!]$/.test(e.data || '')) return;
    const ta = transcriptTextEl;
    const v = ta.value, pos = ta.selectionStart;
    if (pos !== ta.selectionEnd || v[pos - 1] !== e.data) return;
    const m = v.slice(0, pos - 1).match(/(^|[\s(["'])([A-Za-z0-9]{1,12})$/);
    if (!m) return;
    let exp = phraseMap.get(m[2].toLowerCase());
    if (!exp) return;
    if (/^[A-Z][a-z0-9]*$/.test(m[2]) && /^[a-z]/.test(exp)) exp = exp[0].toUpperCase() + exp.slice(1);
    const start = pos - 1 - m[2].length;
    phraseBusy = true;
    ta.setSelectionRange(start, pos - 1);
    if (!document.execCommand || !document.execCommand('insertText', false, exp)) {
      ta.setRangeText(exp, start, pos - 1, 'end');
      ta.dispatchEvent(new Event('input', { bubbles: true }));
    }
    phraseBusy = false;
    const after = start + exp.length + 1;      // past the space / punctuation the user typed
    ta.setSelectionRange(after, after);
    updateLineHighlight();
  });

  const phraseDlg = document.createElement('dialog');
  phraseDlg.className = 'phrase-dlg';
  phraseDlg.innerHTML =
    '<h3>Phrase shortcuts</h3>' +
    '<p>One per line: <b>short = full text</b>. Type the short form and then a space or punctuation, and it expands. ' +
    'Short forms are letters/numbers (up to 12). Capitalised short forms give a capital letter.</p>' +
    '<textarea id="phraseText" spellcheck="false" placeholder="tnx = Thank you.&#10;gm = Good morning.&#10;mtg = meeting&#10;# lines starting with # are ignored"></textarea>' +
    '<div class="dlg-actions"><span class="dlg-err" id="phraseErr"></span>' +
    '<button type="button" class="mini-btn" id="phraseCancel">Cancel</button>' +
    '<button type="button" class="mini-btn primary" id="phraseSave">Save</button></div>';
  document.body.appendChild(phraseDlg);
  const phraseText = phraseDlg.querySelector('#phraseText');
  const phraseErr = phraseDlg.querySelector('#phraseErr');
  const phraseBtn = document.createElement('button');
  phraseBtn.type = 'button';
  phraseBtn.className = 'spk-phrases';
  phraseBtn.textContent = '⚡ Phrases';
  phraseBtn.title = 'Phrase shortcuts (type a short form and it expands)';
  speakerBar.insertBefore(phraseBtn, spkHint);
  phraseBtn.addEventListener('click', () => {
    phraseText.value = loadPhrases();
    phraseErr.textContent = '';
    phraseDlg.showModal();
    phraseText.focus();
  });
  phraseDlg.querySelector('#phraseCancel').addEventListener('click', () => phraseDlg.close());
  phraseDlg.querySelector('#phraseSave').addEventListener('click', () => {
    const { map, bad } = parsePhrases(phraseText.value);
    if (bad.length) { phraseErr.textContent = 'Check line ' + bad.slice(0, 4).join(', ') + ' (use: short = full text)'; return; }
    try { localStorage.setItem(PHRASE_KEY, phraseText.value); } catch (_) {}
    phraseMap = map;
    phraseDlg.close();
    tsStatusEl.textContent = map.size + (map.size === 1 ? ' phrase shortcut saved' : ' phrase shortcuts saved');
  });
  phraseDlg.addEventListener('keydown', e => e.stopPropagation());

  // ── Transcript follows playback ───────────────────────────
  // Finds the timestamped line ([m:ss] or [h:mm:ss]) matching the current
  // media time and scrolls the transcript editor to it.
  let lastSyncLine = -1;
  let suppressSyncUntil = 0; // set when the user clicks a timestamp, so the editor doesn't jump under the cursor

  function parseStamps(text) {
    const stamps = [];
    let pos = 0;
    text.split('\n').forEach((line, i) => {
      const st = lineStamp(line);
      if (st) stamps.push({ time: st.time, start: pos, end: pos + line.length, line: i });
      pos += line.length + 1;
    });
    return stamps;
  }

  // Pixel offset of a character index inside the textarea (handles wrapped lines). See "Text measuring" above.
  function offsetOfChar(index) {
    const ta = transcriptTextEl, cs = getComputedStyle(ta);
    const w = textareaBoxWidth(ta, cs) + calDelta, val = ta.value;
    const sig = w + '|' + cs.fontFamily + '|' + cs.fontSize + '|' + cs.fontWeight + '|' + cs.lineHeight + '|' + cs.letterSpacing;
    if (offCacheText !== val || offCacheSig !== sig) { offCache.clear(); offCacheText = val; offCacheSig = sig; }
    if (offCache.has(index)) return offCache.get(index);
    const m = getMirror();
    paintMirror(m, ta, cs, w);
    m.textContent = val.slice(0, index);
    const marker = document.createElement('span');
    marker.textContent = '\u200b';
    m.appendChild(marker);
    const top = marker.offsetTop;
    offCache.set(index, top);
    return top;
  }

  function syncTranscriptToTime(force) {
    if (markOn || assignOn) return;
    if (!state.items[state.activeIndex]) return;
    if (performance.now() < suppressSyncUntil) return;
    const stamps = parseStamps(transcriptTextEl.value);
    if (!stamps.length) return;
    const now = (video.currentTime || 0) + 0.25;
    let best = null;
    for (const s of stamps) {
      if (s.time <= now && (!best || s.time >= best.time)) best = s;
    }
    if (!best) return;
    const lineChanged = force || best.line !== lastSyncLine;
    lastSyncLine = best.line;

    const ta = transcriptTextEl;
    const pp = playPos();                       // estimated word inside this block; null while paused
    if (!lineChanged && !pp) return;
    // Scroll to the stamp line when it changes (or when paused / seeking). While playing, keep the
    // estimated row in view; never scroll away from the row the user is typing on.
    if (!(pp && pp.typing)) {
      const target = offsetOfChar(pp ? Math.min(pp.at + 1, ta.value.length) : best.start);
      const vis = target - ta.scrollTop;
      if (lineChanged || vis < ta.clientHeight * 0.12 || vis > ta.clientHeight * 0.75) {
        ta.scrollTo({ top: Math.max(0, target - ta.clientHeight * 0.3), behavior: force ? 'auto' : 'smooth' });
      }
    }

    if (lineChanged) {
      if (reviewOn) {
        // Review: the caret follows the audio to just after the line's timestamp, even while the
        // editor is focused (not for 1.5 s after typing, so a word is never split between two lines).
