<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>AMPM Player</title>
  <meta name="theme-color" content="#7c3aed" />
  <style>
    :root {
      --bg: #f4f1fb;
      --panel: #ffffff;
      --ink: #1c1f2a;
      --muted: #6d7483;
      --chip: #efeafc;
      --line: #e5dff5;
      --accent: #7c3aed;
      --frame: #1a1030;
      --shadow: rgba(21, 16, 48, 0.15);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--ink);
      font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    }
    body { overflow: hidden; }
    button, input, textarea {
      font: inherit;
    }
    button {
      cursor: pointer;
      border: 0;
      background: none;
      color: inherit;
      padding: 0;
    }
    .app {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 16px;
      height: 100dvh;
      padding: 18px;
      max-width: 1800px;
      margin: 0 auto;
    }
    .app.transcript-mode {
      grid-template-columns: 72px minmax(0, 1fr);
    }
    .app.library-collapsed {
      grid-template-columns: 0 minmax(0, 1fr);
    }
    .app.library-collapsed .lib {
      display: none;
    }

    .lib, .stage, .transcript-pane {
      background: var(--panel);
      border: 3px solid var(--frame);
      border-radius: 20px;
      box-shadow: 0 10px 26px var(--shadow);
      overflow: hidden;
    }

    .lib {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 0;
      padding: 10px 8px;
      background: #f8f4ff;
    }
    .lib-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 6px 0 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .brand span:last-child { display: none; }
    .logo {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      position: relative;
      display: inline-block;
    }
    .logo::before {
      content: "";
      position: absolute;
      left: 10px; top: 8px;
      width: 0; height: 0;
      border-left: 12px solid #fff;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
    }
    .lib-tools {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 10px;
      display: grid; place-items: center;
      color: var(--ink);
      background: var(--chip);
      font-weight: 700;
    }
    .icon-btn.primary {
      background: var(--accent);
      color: white;
      width: 34px;
      padding: 0;
      font-size: 11px;
    }
    .chips, .library-scroll, .add-box {
      display: none;
    }

    .transcript-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      width: 100%;
      background: var(--panel);
    }
    .transcript-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      min-height: 64px;
    }
    .transcript-head strong {
      font-size: 15px;
      font-weight: 700;
    }
    .head-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .mini-btn {
      background: var(--chip); color: var(--ink); padding: 7px 10px; border-radius: 9px; font-size: 12px; font-weight: 700;
    }
    .mini-btn.primary {
      background: var(--accent); color: white;
    }
    .skip-box {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
      background: var(--chip); border-radius: 8px; padding: 5px 7px;
    }
    .skip-box input {
      width: 54px; border: 1px solid var(--line); border-radius: 7px; background: white; color: var(--ink);
      padding: 4px 6px; font-size: 12px; text-align: center;
    }
    #transcriptText {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      border: 0;
      resize: none;
      background: transparent;
      padding: 16px 18px 0;
      color: var(--ink);
      font: 500 14px/1.6 "Segoe UI", sans-serif;
      outline: none;
    }
    #transcriptText::placeholder { color: var(--muted); }
    .transcript-footer {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 0 18px 14px; border-top: 1px solid var(--line); margin-top: 10px; min-height: 52px;
    }
    #tsStatus { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stamp-btn {
      background: var(--accent); color: #fff; padding: 9px 12px; border-radius: 10px; font-weight: 700;
    }

    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 130px;
      min-height: 130px;
      background: #f3f1fb;
      margin-top: 10px;
      border-width: 2px;
      border-radius: 18px;
      padding: 12px 16px;
    }
    video, .empty-player {
      display: none;
    }
    .player-controls {
      position: relative;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: rgba(0,0,0,.05); border-radius: 12px; padding: 8px 10px;
      color: var(--ink);
    }
    .controls-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: rgba(0,0,0,.05); border-radius: 12px; padding: 8px 10px;
      color: var(--ink);
    }
    .group { display: flex; align-items: center; gap: 10px; }
    .control-btn {
      width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,.06);
      display: grid; place-items: center; font-weight: 700;
      color: var(--ink);
    }
    .control-btn.play {
      width: 46px; height: 46px; background: var(--accent); color: white; font-size: 18px;
    }
    .seek {
      width: 100%; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink);
    }
    .seek input[type="range"] { width: 100%; accent-color: var(--accent); }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .app {
        grid-template-columns: 1fr;
        height: auto; min-height: 100dvh;
      }
      .app.library-collapsed {
        grid-template-columns: 1fr;
      }
      .lib {
        width: 100%;
      }
      .lib-head {
        flex-direction: row;
        justify-content: space-between;
      }
      .lib-tools {
        flex-direction: row;
      }
      .stage { height: 110px; }
    }
  </style>
</head>
<body>
  <div class="app transcript-mode" id="app">
    <aside class="lib" aria-label="Library panel">
      <div class="lib-head">
        <div class="brand">
          <span class="logo" aria-hidden="true"></span>
          <span>AMPM</span>
        </div>
        <div class="lib-tools">
          <button class="icon-btn primary" id="transcriptToggle" type="button">T</button>
          <button class="icon-btn" id="libToggle" aria-label="Hide library" type="button">☰</button>
          <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" type="button">☼</button>
          <button class="icon-btn" id="searchBtn" aria-label="Search videos" type="button">⌕</button>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="library-scroll" id="library"></div>
      <div class="add-box">
        <label class="add-row">
          <span class="add-btn">Add videos
            <input id="fileIn" type="file" accept="video/*,audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.wma,.aiff,.webm,.mp4,.m4v,.mov,.mkv,.avi,.mpeg,.mpg,.srt" multiple hidden>
          </span>
          <span class="add-btn alt">Add folder
            <input id="dirIn" type="file" webkitdirectory multiple hidden>
          </span>
        </label>
      </div>
    </aside>

    <div style="display:flex; flex-direction:column; gap:10px; min-width:0;">
      <aside class="transcript-pane" aria-label="Transcript editor">
        <div class="transcript-head">
          <strong>Transcript</strong>
          <div class="head-tools">
            <label class="skip-box" aria-label="Skip time in seconds">
              Skip
              <input id="skipInput" type="number" min="1" max="60" step="1" value="2" />
              s
            </label>
            <button class="mini-btn primary" id="pauseEditBtn" type="button">Pause + edit</button>
            <button class="mini-btn" id="replayBtn" type="button">Replay</button>
          </div>
        </div>
        <textarea id="transcriptText" placeholder="Type or paste the transcript here. Use keyboard shortcuts or click a timestamp button while reviewing the video."></textarea>
        <div class="transcript-footer">
          <div id="tsStatus">No video loaded</div>
          <button class="stamp-btn" id="stampBtn" type="button">Insert timestamp</button>
        </div>
      </aside>

      <main class="stage" aria-label="Audio controls">
        <video id="video" playsinline></video>
        <div class="empty-player" id="emptyPlayer">Choose a video to begin transcription.</div>
        <div class="player-controls" id="controls" hidden>
          <div class="topbar">
            <div class="title" id="videoTitle">No audio</div>
            <div class="group">
              <button class="control-btn" id="jumpBack" type="button">−5</button>
              <button class="control-btn" id="jumpForward" type="button">+5</button>
            </div>
          </div>
          <div class="controls-row">
            <div class="group">
              <button class="control-btn" id="prevBtn" type="button">⏮</button>
              <button class="control-btn play" id="playBtn" type="button">▶</button>
              <button class="control-btn" id="nextBtn" type="button">⏭</button>
            </div>
            <div class="seek">
              <span id="currentTime">00:00</span>
              <input id="seekBar" type="range" min="0" max="1000" value="0" aria-label="Seek audio" />
              <span id="totalTime">00:00</span>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const libraryEl = document.getElementById('library');
    const chipsEl = document.getElementById('chips');
    const emptyPlayer = document.getElementById('emptyPlayer');
    const controlsEl = document.getElementById('controls');
    const videoTitleEl = document.getElementById('videoTitle');
    const seekBar = document.getElementById('seekBar');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');
    const transcriptTextEl = document.getElementById('transcriptText');
    const tsStatusEl = document.getElementById('tsStatus');
    const appEl = document.getElementById('app');
    const skipInput = document.getElementById('skipInput');

    const state = {
      items: [],
      folder: null,
      activeIndex: -1,
      search: '',
      transcriptMode: true,
      libraryCollapsed: false,
      skipSeconds: 2
    };

    function normalizeSkipSeconds() {
      const raw = Number(skipInput.value);
      if (!Number.isFinite(raw)) {
        state.skipSeconds = 2;
      } else {
        state.skipSeconds = Math.max(1, Math.min(60, Math.round(raw)));
      }
      skipInput.value = String(state.skipSeconds);
      return state.skipSeconds;
    }

    function fmtTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '00:00';
      const total = Math.floor(seconds);
      const hours = Math.floor(total / 3600);
      const mins = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      return hours > 0
        ? `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`
        : `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function cleanName(name) {
      return name.replace(/\.[^/.]+$/, '');
    }

    function addFiles(fileList, useFolder) {
      const files = Array.from(fileList || []);
      files.forEach((file) => {
        if (!file) return;
        const isVideo = file.type.startsWith('video/') || /\.(mp4|m4v|mov|mkv|webm|avi|mpeg|mpg|wmv)$/i.test(file.name);
        const isAudio = file.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|aac|flac|wma|aiff)$/i.test(file.name);
        if (!isVideo && !isAudio && !/\.srt$/i.test(file.name)) return;
        const folder = useFolder && (file.webkitRelativePath || '').split('/').slice(0, -1).join('/') || 'Library';
        const key = `${file.name}|${file.size}|${file.lastModified}`;
        if (state.items.some(item => item.key === key)) return;
        const item = {
          key,
          name: cleanName(file.name),
          folder,
          url: URL.createObjectURL(file),
          type: isVideo ? 'video' : 'audio',
          file
        };
        state.items.push(item);
      });
      renderLibrary();
      if (state.items.length && state.activeIndex === -1) {
        loadItem(0, false);
      }
    }

    function renderChips() {
      const folders = [...new Set(state.items.map(item => item.folder))];
      chipsEl.innerHTML = '';
      const allChip = document.createElement('button');
      allChip.className = `chip ${state.folder === null ? 'active' : ''}`;
      allChip.textContent = 'All';
      allChip.addEventListener('click', () => {
        state.folder = null;
        renderLibrary();
      });
      chipsEl.appendChild(allChip);

      folders.forEach((folder) => {
        const chip = document.createElement('button');
        chip.className = `chip ${state.folder === folder ? 'active' : ''}`;
        chip.textContent = folder;
        chip.addEventListener('click', () => {
          state.folder = folder;
          renderLibrary();
        });
        chipsEl.appendChild(chip);
      });
    }

    function renderLibrary() {
      renderChips();
      let filtered = state.items.filter((item) => {
        const folderMatch = !state.folder || item.folder === state.folder;
        const searchMatch = !state.search || item.name.toLowerCase().includes(state.search.toLowerCase());
        return folderMatch && searchMatch;
      });

      libraryEl.innerHTML = '';
      if (!filtered.length) {
        const empty = document.createElement('div');
        empty.textContent = 'No media';
        empty.style.padding = '20px 8px';
        empty.style.color = 'var(--muted)';
        libraryEl.appendChild(empty);
        return;
      }

      filtered.forEach((item) => {
        const button = document.createElement('button');
        button.className = `video-item ${state.activeIndex === state.items.indexOf(item) ? 'active' : ''}`;
        button.type = 'button';
        button.innerHTML = `
          <div class="thumb"><div class="bar"></div></div>
          <div class="meta">
            <strong>${item.name}</strong>
            <span>${item.type === 'video' ? 'Video' : 'Audio'}</span>
          </div>
        `;
        button.addEventListener('click', () => {
          loadItem(state.items.indexOf(item), true);
        });
        libraryEl.appendChild(button);
      });
    }

    function loadItem(index, autoplay) {
      if (index < 0 || index >= state.items.length) return;
      state.activeIndex = index;
      const item = state.items[index];
      video.src = item.url;
      videoTitleEl.textContent = item.name;
      emptyPlayer.hidden = true;
      controlsEl.hidden = false;
      tsStatusEl.textContent = item.name;
      if (autoplay) {
        video.play().catch(() => {});
      }
      renderLibrary();
    }

    function togglePlay() {
      if (state.activeIndex < 0) return;
      if (video.paused) {
        video.play().catch(() => {});
      } else {
        video.pause();
      }
    }

    function updateTranscriptMode() {
      appEl.classList.toggle('transcript-mode', !!state.transcriptMode);
      document.getElementById('transcriptToggle').textContent = state.transcriptMode ? 'T' : 'T';
    }

    function updateLibraryMode() {
      appEl.classList.toggle('library-collapsed', !!state.libraryCollapsed);
      const libBtn = document.getElementById('libToggle');
      libBtn.setAttribute('aria-label', state.libraryCollapsed ? 'Expand library' : 'Hide library');
      libBtn.textContent = state.libraryCollapsed ? '☰' : '☰';
    }

    function updatePlaybackUI() {
      const playBtn = document.getElementById('playBtn');
      playBtn.textContent = video.paused ? '▶' : '❚❚';
      currentTimeEl.textContent = fmtTime(video.currentTime || 0);
      totalTimeEl.textContent = fmtTime(video.duration || 0);
      if (video.duration) {
        seekBar.value = (video.currentTime / video.duration) * 1000;
      }
      tsStatusEl.textContent = state.items[state.activeIndex] ? state.items[state.activeIndex].name : 'No audio loaded';
    }

    function seekBy(seconds) {
      if (!video.duration) return;
      video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + seconds));
    }

    function insertTimestamp() {
      if (!state.items[state.activeIndex]) {
        tsStatusEl.textContent = 'Add an audio first';
        return;
      }
      const stamp = `[${fmtTime(video.currentTime || 0)}] `;
      const start = transcriptTextEl.selectionStart;
      const end = transcriptTextEl.selectionEnd;
      transcriptTextEl.value = transcriptTextEl.value.slice(0, start) + stamp + transcriptTextEl.value.slice(end);
      transcriptTextEl.focus();
      transcriptTextEl.setSelectionRange(start + stamp.length, start + stamp.length);
      tsStatusEl.textContent = 'Inserted timestamp';
    }

    function pauseAndEdit() {
      if (!state.items[state.activeIndex]) {
        tsStatusEl.textContent = 'Add an audio first';
        return;
      }
      state.transcriptMode = true;
      updateTranscriptMode();
      video.pause();
      transcriptTextEl.focus();
      tsStatusEl.textContent = 'Paused for editing';
    }

    function setupEvents() {
      document.getElementById('transcriptToggle').addEventListener('click', () => {
        state.transcriptMode = !state.transcriptMode;
        updateTranscriptMode();
      });

      document.getElementById('libToggle').addEventListener('click', () => {
        state.libraryCollapsed = !state.libraryCollapsed;
        updateLibraryMode();
      });

      document.getElementById('playBtn').addEventListener('click', togglePlay);
      document.getElementById('prevBtn').addEventListener('click', () => {
        if (state.activeIndex > 0) loadItem(state.activeIndex - 1, true);
      });
      document.getElementById('nextBtn').addEventListener('click', () => {
        if (state.activeIndex < state.items.length - 1) loadItem(state.activeIndex + 1, true);
      });
      document.getElementById('jumpBack').addEventListener('click', () => seekBy(-5));
      document.getElementById('jumpForward').addEventListener('click', () => seekBy(5));
      document.getElementById('pauseEditBtn').addEventListener('click', pauseAndEdit);
      document.getElementById('replayBtn').addEventListener('click', () => {
        if (state.items[state.activeIndex]) {
          video.currentTime = 0; video.play().catch(() => {});
        }
      });
      document.getElementById('stampBtn').addEventListener('click', insertTimestamp);
      skipInput.addEventListener('input', normalizeSkipSeconds);

      document.getElementById('themeBtn').addEventListener('click', () => {
        document.documentElement.style.setProperty('--bg', document.documentElement.style.getPropertyValue('--bg') === '#f4f1fb' ? '#15131d' : '#f4f1fb');
        document.documentElement.style.setProperty('--panel', document.documentElement.style.getPropertyValue('--panel') === '#ffffff' ? '#201d2f' : '#ffffff');
        document.documentElement.style.setProperty('--ink', document.documentElement.style.getPropertyValue('--ink') === '#1c1f2a' ? '#f3f5fb' : '#1c1f2a');
        document.documentElement.style.setProperty('--muted', document.documentElement.style.getPropertyValue('--muted') === '#6d7483' ? '#b5bdd1' : '#6d7483');
        document.documentElement.style.setProperty('--chip', document.documentElement.style.getPropertyValue('--chip') === '#efeafc' ? '#2d2a3d' : '#efeafc');
        document.documentElement.style.setProperty('--line', document.documentElement.style.getPropertyValue('--line') === '#e5dff5' ? '#3b394c' : '#e5dff5');
      });

      document.getElementById('searchBtn').addEventListener('click', () => {
        const value = window.prompt('Search audio by name', state.search || '');
        if (value === null) return;
        state.search = value.trim();
        renderLibrary();
      });

      document.getElementById('fileIn').addEventListener('change', (event) => {
        addFiles(event.target.files, false);
        event.target.value = '';
      });

      document.getElementById('dirIn').addEventListener('change', (event) => {
        addFiles(event.target.files, true);
        event.target.value = '';
      });

      video.addEventListener('timeupdate', updatePlaybackUI);
      video.addEventListener('loadedmetadata', updatePlaybackUI);
      video.addEventListener('play', updatePlaybackUI);
      video.addEventListener('pause', updatePlaybackUI);
      video.addEventListener('ended', () => {
        if (state.activeIndex < state.items.length - 1) {
          loadItem(state.activeIndex + 1, true);
        }
      });

      seekBar.addEventListener('input', () => {
        if (!video.duration) return;
        const progress = Number(seekBar.value) / 1000;
        video.currentTime = progress * video.duration;
      });

      document.addEventListener('keydown', (event) => {
        const tag = event.target.tagName;
        const isTextInput = tag === 'TEXTAREA' || tag === 'INPUT';

        if ((event.ctrlKey || event.metaKey) && event.code === 'Space') {
          event.preventDefault();
          togglePlay();
          return;
        }

        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
          event.preventDefault();
          insertTimestamp();
          return;
        }

        if (event.key === '[' || event.key === '{') {
          event.preventDefault();
          seekBy(-normalizeSkipSeconds());
          return;
        }

        if (event.key === ']' || event.key === '}') {
          event.preventDefault();
          seekBy(normalizeSkipSeconds());
          return;
        }

        if (isTextInput) {
          if (event.key === 'Escape') {
            transcriptTextEl.blur();
            state.transcriptMode = false;
            updateTranscriptMode();
          }
          return;
        }

        if (event.key === ' ') {
          event.preventDefault();
          togglePlay();
        } else if (event.key === 'ArrowLeft') {
          seekBy(-5);
        } else if (event.key === 'ArrowRight') {
          seekBy(5);
        } else if (event.key === 'ArrowUp') {
          video.volume = Math.min(1, (video.volume || 0.5) + 0.05);
        } else if (event.key === 'ArrowDown') {
          video.volume = Math.max(0, (video.volume || 0.5) - 0.05);
        } else if (event.key === 'p' || event.key === 'P') {
          pauseAndEdit();
        } else if (event.key === 't' || event.key === 'T') {
          insertTimestamp();
        }
      });
    }

    setupEvents();
    normalizeSkipSeconds();
    updateTranscriptMode();
    updateLibraryMode();
    renderLibrary();
    updatePlaybackUI();
  </script>
</body>
</html>
